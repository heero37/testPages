<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mes recettes</title><style>:root{font-family:system-ui,sans-serif;background:#f5f8f3;color:#24382b}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:30px 20px}a{color:#36744d}h1{font-size:clamp(2rem,5vw,3rem)}.bar{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0}input,select,textarea{font:inherit;border:1px solid #cbd9cc;border-radius:10px;padding:11px;background:white;max-width:100%}textarea{width:100%;min-height:100px}#search{flex:1;min-width:200px}button{font:inherit;border:0;border-radius:10px;padding:11px 15px;background:#357653;color:white;cursor:pointer}button:hover{filter:brightness(.9)}.secondary{background:#e4eee5;color:#275b3b}.danger{background:#fbe4e2;color:#96372d}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}.card{background:white;border-radius:16px;padding:22px;box-shadow:0 5px 20px #17301d13}.card p{color:#65776a}.actions{display:flex;gap:8px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#10251ac9;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.panel{background:white;border-radius:18px;padding:25px;width:min(100%,650px);max-height:90vh;overflow:auto}.field{display:block;margin:12px 0}.field input,.field select{display:block;width:100%;margin-top:5px}.field textarea{display:block;margin-top:5px}.buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.details{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}@media(max-width:600px){.bar>*{width:100%}}</style></head><body><main><a href="index.html">← Accueil</a><h1>🍲 Mes recettes</h1><p>Votre carnet de cuisine personnel.</p><div class="bar"><input id="search" placeholder="Rechercher une recette ou un ingrédient…" aria-label="Rechercher"><select id="filter"><option value="">Toutes catégories</option><option>Entrée</option><option>Plat</option><option>Dessert</option><option>Boisson</option><option>Autre</option></select><button id="new">+ Nouvelle recette</button><button class="secondary" id="export">Exporter JSON</button><button class="secondary" id="import">Importer JSON</button><input id="file" type="file" accept=".json,application/json" hidden></div><div id="cards" class="grid"></div></main><div id="editor" class="modal" role="dialog" aria-modal="true" aria-label="Modifier une recette"><div class="panel"><h2 id="heading">Nouvelle recette</h2><form id="form"><label class="field">Nom *<input name="name" required maxlength="120"></label><label class="field">Catégorie<select name="category"><option>Plat</option><option>Entrée</option><option>Dessert</option><option>Boisson</option><option>Autre</option></select></label><label class="field">Temps (minutes)<input name="minutes" type="number" min="0"></label><label class="field">Portions<input name="servings" type="number" min="1"></label><label class="field">Ingrédients (un par ligne)<textarea name="ingredients"></textarea></label><label class="field">Étapes de préparation<textarea name="steps" rows="6"></textarea></label><div class="buttons"><button type="button" class="secondary" data-close>Annuler</button><button>Enregistrer</button></div></form></div></div><div id="viewer" class="modal" role="dialog" aria-modal="true" aria-label="Consulter une recette"><div class="panel"><h2 id="viewName"></h2><p id="viewMeta"></p><h3>Ingrédients</h3><div id="viewIngredients" class="details"></div><h3>Préparation</h3><div id="viewSteps" class="details"></div><div class="buttons"><button class="secondary" data-close>Fermer</button></div></div></div><script>
(()=>{const key='testpages.recettes.v1',el=id=>document.getElementById(id);let recipes=[],editing=null;const valid=r=>r&&typeof r.id==='string'&&typeof r.name==='string'&&typeof r.category==='string'&&typeof r.ingredients==='string'&&typeof r.steps==='string';try{const data=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(data))recipes=data.filter(valid)}catch{alert('Impossible de lire les recettes enregistrées.')}function save(){try{localStorage.setItem(key,JSON.stringify(recipes));return true}catch{alert('Enregistrement impossible');return false}}function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function close(){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('open'))}function open(id){el(id).classList.add('open')}function edit(r){editing=r?.id||null;const f=el('form');f.reset();el('heading').textContent=r?'Modifier la recette':'Nouvelle recette';if(r)for(const k of ['name','category','minutes','servings','ingredients','steps'])f.elements.namedItem(k).value=r[k]||'';open('editor')}function view(r){el('viewName').textContent=r.name;el('viewMeta').textContent=[r.category,r.minutes?r.minutes+' min':null,r.servings?r.servings+' portions':null].filter(Boolean).join(' · ');el('viewIngredients').textContent=r.ingredients||'Non renseignés';el('viewSteps').textContent=r.steps||'Non renseignée';open('viewer')}function render(){const q=el('search').value.toLocaleLowerCase('fr'),category=el('filter').value,root=el('cards');root.replaceChildren();const items=recipes.filter(r=>(!category||r.category===category)&&[r.name,r.ingredients,r.steps].join(' ').toLocaleLowerCase('fr').includes(q));if(!items.length){root.append(node('p',recipes.length?'Aucun résultat.':'Aucune recette. Ajoutez votre première recette !'));return}for(const r of items){const card=node('article',undefined,'card');card.append(node('small',r.category),node('h2',r.name),node('p',[r.minutes?r.minutes+' min':null,r.servings?r.servings+' portions':null].filter(Boolean).join(' · ')));const actions=node('div',undefined,'actions');for(const [label,fn,cls] of [['Voir',()=>view(r),'secondary'],['Modifier',()=>edit(r),'secondary'],['Supprimer',()=>{if(confirm('Supprimer « '+r.name+' » ?')){const old=recipes;recipes=recipes.filter(x=>x.id!==r.id);if(!save())recipes=old;render()}},'danger']]){const b=node('button',label,cls);b.addEventListener('click',fn);actions.append(b)}card.append(actions);root.append(card)}}el('new').onclick=()=>edit();el('search').oninput=render;el('filter').onchange=render;el('form').onsubmit=e=>{e.preventDefault();const f=e.currentTarget,v=k=>f.elements.namedItem(k).value.trim();const r={id:editing||(typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()),name:v('name'),category:v('category'),minutes:v('minutes'),servings:v('servings'),ingredients:v('ingredients'),steps:v('steps')};const old=recipes;recipes=editing?recipes.map(x=>x.id===editing?r:x):[r,...recipes];if(!save()){recipes=old;return}close();render()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});el('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(recipes,null,2)],{type:'application/json'}));const a=node('a');a.href=url;a.download='mes-recettes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};el('import').onclick=()=>el('file').click();el('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error('Fichier trop volumineux');const data=JSON.parse(await file.text());if(!Array.isArray(data)||!data.every(valid))throw Error('Format invalide');if(!confirm('Remplacer vos recettes par les '+data.length+' recettes importées ?'))return;const old=recipes;recipes=data;if(!save())recipes=old;render()}catch(err){alert('Import impossible : '+err.message)}finally{e.target.value=''}};render()})();
